name: Latchkey
options:
  bundleIdPrefix: net.melisma
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Pinned by commit, not by tag: a tag can be moved to other code, a commit can't. This is the
    # commit of the tag named after it (git ls-remote <url> refs/tags/<version>). XcodeGen ignores
    # `revision` when a version is also given, so the version lives in the comment only;
    # scripts/sparkle-advisories.sh reads it from there.
    revision: eef1a539a373c1f1a320624b1130fc5de7b2e100  # 2.10.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.8.13"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    DEAD_CODE_STRIPPING: YES
  configs:
    # Development signing adds the debugging entitlement (get-task-allow), which lets any program
    # running as the Owner take over the app and use its privacy permissions. The installed app
    # is a Release build: no debugging entitlement there (security scan, 2026-10-24); Debug keeps it.
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      LATCHKEY_APP_ID: net.melisma.latchkey
      LATCHKEY_URL_SCHEME: latchkey
      LATCHKEY_DISPLAY_NAME: Latchkey
    # Debug and test builds are their own app in macOS's eyes (Toni, 2026-10-25): their own bundle
    # identifier, and so their own settings, Keychain items, privacy permissions, and helper, and
    # no claim on latchkey:// links. A test copy sharing the installed app's identity erased the
    # Owner's pairing twice, and a leftover Debug build (which carries the debugging entitlement)
    # could borrow the installed app's permissions. The Release values must never change: the
    # installed app's pairing and permissions are filed under them. Shared/AppIdentity.swift
    # holds the same names for the code; IdentityTests checks the two agree.
    Debug:
      LATCHKEY_APP_ID: net.melisma.latchkey.dev
      LATCHKEY_URL_SCHEME: latchkey-dev
      LATCHKEY_DISPLAY_NAME: Latchkey Dev
targets:
  Latchkey:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - target: LatchkeyHelper
        embed: true
        copy:
          destination: executables
      - package: Sparkle
    # The helper's launchd plist, made from the one template with this configuration's
    # identifiers and named after the helper (Release: net.melisma.latchkey.helper.plist, exactly
    # the file that used to be copied in). Runs before the app is signed.
    postCompileScripts:
      - name: Helper launchd plist
        script: |
          set -eu
          out="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          mkdir -p "$out"
          rm -f "$out"/*.plist
          sed "s/\$(LATCHKEY_APP_ID)/$LATCHKEY_APP_ID/g" "$SRCROOT/Helper/LaunchDaemon.plist" > "$out/$LATCHKEY_APP_ID.helper.plist"
          plutil -lint -s "$out/$LATCHKEY_APP_ID.helper.plist"
        inputFiles:
          - $(SRCROOT)/Helper/LaunchDaemon.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(LATCHKEY_APP_ID).helper.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LATCHKEY_APP_ID)
        PRODUCT_NAME: Latchkey
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Latchkey.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
  LatchkeyHelper:
    type: tool
    platform: macOS
    sources:
      - Helper
      - Shared/HelperProtocol.swift
      - Shared/AppIdentity.swift
      - Shared/PmsetParser.swift
      - Shared/CodeSigning.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LATCHKEY_APP_ID).helper
        PRODUCT_NAME: LatchkeyHelper
        INFOPLIST_FILE: Helper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    excludes:
      - "*.plist"
  LatchkeyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Latchkey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LATCHKEY_APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Latchkey.app/Contents/MacOS/Latchkey"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Latchkey:
    build:
      targets:
        Latchkey: all
        LatchkeyTests: [test]
    test:
      targets:
        - LatchkeyTests
      environmentVariables:
        LATCHKEY_FIXTURES: "$(SRCROOT)/../specs/001-core/contracts/fixtures"
