# Builds the Mac app on macOS for every change to macos/ (pull requests and main), so Swift that
# was written in a cloud session (no Swift there) is compiled before it merges, and runs the
# update tests (spec 001 FR-072 to FR-072d). Signed ad hoc, as the Mac's own test runs are; the
# full test suite still runs on the Mac (docs/cloud-sessions.md). No secrets, read-only token.
name: mac build
on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/mac-build.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/mac-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: XcodeGen, pinned by checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.45.0/xcodegen.zip
          echo "fb55d430229e0c00c4c354e682f2ac86f413f28468fbf83cd8b85d0a703a0fdb  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >>"$GITHUB_PATH"
      - name: Lint (swift format, as make lint)
        working-directory: macos
        run: swift format lint --strict -r App Shared Helper Tests
      # Xcode's compilation cache (Xcode 26), kept between runs: runs on main save it, pull
      # requests start from main's (and their own last run's), so a build compiles only what
      # changed instead of everything (about 5 minutes; Toni, 2026-11-25: "cut the 40 minutes").
      - name: Compilation cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/xcache
          key: mac-xcache-${{ hashFiles('macos/project.yml') }}-${{ github.sha }}
          restore-keys: |
            mac-xcache-${{ hashFiles('macos/project.yml') }}-
            mac-xcache-
      - name: Build for testing (signed ad hoc)
        working-directory: macos
        run: |
          set -o pipefail
          xcodebuild -version
          xcodegen generate --quiet
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/xcache" \
            build-for-testing -quiet
          du -sh "$RUNNER_TEMP/xcache" 2>/dev/null || true
      - name: Update tests
        working-directory: macos
        run: |
          set -o pipefail
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -only-testing:LatchkeyTests/UpdateGateTests -only-testing:LatchkeyTests/ReleaseCheckTests \
            test-without-building -quiet
      # The whole unit test suite, reported, not a gate (2026-11-23): on this runner (macOS 26,
      # slower than the Mac) about 30 tests miss their timing limits or need the owner's Mac, on
      # main as on a branch, so compare a branch's failures with main's. Each failure is printed
      # with why, and the test host's crash reports with their stacks.
      - name: Unit tests (reported)
        working-directory: macos
        continue-on-error: true
        run: |
          rc=0
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" test-without-building > "$RUNNER_TEMP/test.log" 2>&1 || rc=$?
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/tests.xcresult" \
            | jq -r '.testFailures[]? | "FAILURE \(.testIdentifierString): \(.failureText)"' | head -300 || true
          find ~/Library/Logs/DiagnosticReports -name '*.ips' -mmin -60 2>/dev/null | head -3 | while read -r f; do
            echo "== $f"
            tail -n +2 "$f" | jq -r '.threads[]? | select(.triggered == true) | .frames[:25][] | "\(.imageIndex) \(.symbol // "?") \(.sourceFile // "")"' || head -80 "$f"
          done
          tail -40 "$RUNNER_TEMP/test.log"
          exit "$rc"
      # The browser and sign-in tests again, on their own (2026-11-25): in the full suite, many
      # pages at once load this runner so much that a page takes over 10 s to answer a script
      # (on main too); alone, their failures are their own.
      - name: Browser and sign-in tests on their own (reported)
        if: always()
        working-directory: macos
        continue-on-error: true
        run: |
          rc=0
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -resultBundlePath "$RUNNER_TEMP/browser.xcresult" \
            -only-testing:LatchkeyTests/SignInFillTests -only-testing:LatchkeyTests/RegressionLoginsBTests \
            -only-testing:LatchkeyTests/RegressionLoginsCTests -only-testing:LatchkeyTests/RegressionRealInputTests \
            -only-testing:LatchkeyTests/RegressionRichEditorCTests -only-testing:LatchkeyTests/RegressionHoverCTests \
            -only-testing:LatchkeyTests/LockedBrowserTests \
            -only-testing:LatchkeyTests/LockedBrowserActionTests -only-testing:LatchkeyTests/BrowserDialogTests \
            test-without-building > "$RUNNER_TEMP/browser.log" 2>&1 || rc=$?
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/browser.xcresult" \
            | jq -r '"ALONE passed \(.passedTests) failed \(.failedTests)", (.testFailures[]? | "ALONE FAILURE \(.testIdentifierString): \(.failureText)")' | head -100 || true
          exit "$rc"
