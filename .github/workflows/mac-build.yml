# Builds the Mac app on macOS for every change to macos/ (pull requests and main), so Swift that
# was written in a cloud session (no Swift there) is compiled before it merges, and runs the
# update tests (spec 001 FR-072 to FR-072d). Signed ad hoc, as the Mac's own test runs are; the
# full test suite still runs on the Mac (docs/cloud-sessions.md). No secrets, read-only token.
name: mac build
on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/mac-build.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/mac-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Five jobs side by side (Toni, 2026-11-26: "split the slow step into parallel jobs, get it
  # to 5 minutes"; GitHub runs at most 5 macOS jobs at once on this plan). Each builds (with
  # Xcode's compilation cache and the Swift packages kept between runs), then runs its part:
  # job 0 lints and runs the update and unit tests; all five share the tests with web pages or
  # time limits, which run one at a time within a job, split by measured time
  # (macos/scripts/shard-suites.py, macos/scripts/suite-seconds.txt).
  build:
    name: build and test (${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: XcodeGen, pinned by checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.45.0/xcodegen.zip
          echo "fb55d430229e0c00c4c354e682f2ac86f413f28468fbf83cd8b85d0a703a0fdb  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >>"$GITHUB_PATH"
      - name: Lint (swift format, as make lint)
        if: matrix.shard == 0
        working-directory: macos
        run: swift format lint --strict -r App Shared Helper Tests
      # Xcode's compilation cache (Xcode 26), kept between runs: runs on main save it, pull
      # requests start from main's (and their own last run's), so a build compiles only what
      # changed instead of everything (Toni, 2026-11-25: "cut the 40 minutes").
      # Job 0 saves the caches; the others only take them (saving the same key five times
      # costs each job ~10 s at its end and only one save can win).
      - name: Compilation cache
        if: matrix.shard == 0
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/xcache
          key: mac-xcache-${{ hashFiles('macos/project.yml') }}-${{ github.sha }}
          restore-keys: |
            mac-xcache-${{ hashFiles('macos/project.yml') }}-
            mac-xcache-
      - name: Compilation cache (taken only)
        if: matrix.shard != 0
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/xcache
          key: mac-xcache-${{ hashFiles('macos/project.yml') }}-${{ github.sha }}
          restore-keys: |
            mac-xcache-${{ hashFiles('macos/project.yml') }}-
            mac-xcache-
      # The Swift packages (Sparkle and the rest), pinned in project.yml: fetched once, not
      # every run (about 90 s of each build before, 2026-11-26).
      - name: Swift packages cache
        if: matrix.shard == 0
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/spm
          key: mac-spm-${{ hashFiles('macos/project.yml') }}
      - name: Swift packages cache (taken only)
        if: matrix.shard != 0
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/spm
          key: mac-spm-${{ hashFiles('macos/project.yml') }}
      - name: Build for testing (signed ad hoc)
        working-directory: macos
        run: |
          set -o pipefail
          xcodebuild -version
          xcodegen generate --quiet
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/xcache" \
            build-for-testing -quiet
          du -sh "$RUNNER_TEMP/xcache" 2>/dev/null || true
      - name: Update tests
        if: matrix.shard == 0
        working-directory: macos
        run: |
          set -o pipefail
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -only-testing:LatchkeyTests/UpdateGateTests -only-testing:LatchkeyTests/ReleaseCheckTests \
            test-without-building -quiet
      # The whole unit test suite, reported, not a gate (2026-11-23): compare a branch's failures
      # with main's. Each failure is printed with why, and the test host's crash reports with
      # their stacks. Without the tests that open web pages or measure time limits: they run one
      # at a time in the next step.
      - name: Unit tests (reported)
        if: matrix.shard == 0
        working-directory: macos
        continue-on-error: true
        run: |
          rc=0
          skip=$(cat scripts/page-suites.txt scripts/timing-suites.txt | sed 's/^/-skip-testing:LatchkeyTests\//' | tr '\n' ' ')
          # shellcheck disable=SC2086
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" $skip test-without-building > "$RUNNER_TEMP/test.log" 2>&1 || rc=$?
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/tests.xcresult" \
            | jq -r '"UNIT passed \(.passedTests) failed \(.failedTests)", (.testFailures[]? | "FAILURE \(.testIdentifierString): \(.failureText)")' | head -300 || true
          find ~/Library/Logs/DiagnosticReports -name '*.ips' -mmin -60 2>/dev/null | head -3 | while read -r f; do
            echo "== $f"
            tail -n +2 "$f" | jq -r '.threads[]? | select(.triggered == true) | .frames[:25][] | "\(.imageIndex) \(.symbol // "?") \(.sourceFile // "")"' || head -80 "$f"
          done
          tail -40 "$RUNNER_TEMP/test.log"
          exit "$rc"
      # The tests that open web pages, one at a time within a job (Toni, 2026-11-25): run side
      # by side in one test program, dozens of pages share its one main thread, so a page's
      # events come late and steps pass their limits (measured 2026-11-25: a click 2 s alone,
      # 18 s among 70 pages). With them, the tests of time limits: side by side with the rest, a
      # 2.8 s limit measured 13.6 s (2026-11-25). Job 0's share is smaller by its unit tests.
      - name: Tests with web pages or time limits, one at a time (reported)
        if: always()
        working-directory: macos
        continue-on-error: true
        run: |
          rc=0
          only=$(python3 scripts/shard-suites.py 5 ${{ matrix.shard }} 80 | sed 's/^/-only-testing:LatchkeyTests\//' | tr '\n' ' ')
          echo "$only"
          # shellcheck disable=SC2086
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -resultBundlePath "$RUNNER_TEMP/pages.xcresult" -parallel-testing-enabled NO $only \
            test-without-building > "$RUNNER_TEMP/pages.log" 2>&1 || rc=$?
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/pages.xcresult" \
            | jq -r '"PAGES passed \(.passedTests) failed \(.failedTests)", (.testFailures[]? | "PAGES FAILURE \(.testIdentifierString): \(.failureText)")' | head -150 | cut -c1-3000 || true
          # Where the time goes (instrumentation): each suite's seconds, for suite-seconds.txt,
          # and the slowest 10 tests.
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/pages.xcresult" > "$RUNNER_TEMP/pages-tests.json" || true
          jq -r '.. | objects | select(.nodeType? == "Test Suite") | "SUITE \([.. | objects | select(.nodeType? == "Test Case") | .durationInSeconds // 0] | add // 0 | ceil) \(.name)"' "$RUNNER_TEMP/pages-tests.json" || true
          jq -r '[.. | objects | select(.nodeType? == "Test Case") | {n: .name, d: (.durationInSeconds // 0)}] | sort_by(-.d) | .[:10][] | "SLOW \(.d | floor)s \(.n)"' "$RUNNER_TEMP/pages-tests.json" || true
          tail -5 "$RUNNER_TEMP/pages.log"
          exit "$rc"
