# End-to-end checks of the capabilities a pull request changes (spec 015 FR-1500 to FR-1506):
# a real MCP client through a private relay started for the run, calling the real Linux program
# (e2e-linux), checked on the machine's own state. The Mac app's end-to-end check runs in
# ci.yml's Mac build job 3, reusing its build (spec 016). e2e-linux always runs, so it shows on
# every pull request (reported, not required: decided 2026-11-25), and passes at once when nothing
# it covers changed. No Claude, no secrets, nothing reaches anyone's own Mac.
name: e2e
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      linux_checks: ${{ steps.pick.outputs.linux_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff against the pull request's base
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - id: pick
        working-directory: relay
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: go run ./cmd/e2e pick -base "$BASE"

  e2e-linux:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Nothing selected
        if: needs.pick.outputs.linux != 'true'
        working-directory: .
        run: echo "No change to the relay or the Linux program; nothing to check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.pick.outputs.linux == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: needs.pick.outputs.linux == 'true'
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: The relay's own tools (private relay, pretend Mac, headless Chrome)
        if: contains(needs.pick.outputs.linux_checks, 'relay')
        run: go run ./cmd/e2e relay
      - name: The Linux program (Debian container with systemd)
        if: contains(needs.pick.outputs.linux_checks, 'linux')
        run: go run ./cmd/linuxcheck
