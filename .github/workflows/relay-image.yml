# Publishes the relay image to ghcr.io/tonimelisma/latchkey-relay whenever relay/ changes on main
# (or on repository_dispatch "relay-image"), tagged with the commit and "latest", and signs it with
# cosign, keyless: the signature names this workflow on main (GitHub's identity token, Sigstore's
# certificate and transparency log). That is the production deploy: a host that verifies the
# signature switches to the new image by itself, and self-hosted relays that follow "latest" update
# too (spec 009 FR-911). Nothing is published unless the security checks, lint and the full test suite
# pass; multi-arch (x86 and ARM servers), with an SBOM and build provenance. The publishing job
# runs in the environment "production", where the owner can require an approval.
name: relay image
on:
  push:
    branches: [main]
    paths: ["relay/**"]
  repository_dispatch:
    types: [relay-image]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-image
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Security checks
        run: make security
      - name: Lint
        run: make lint
      - name: Test
        run: make test
  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign's keyless signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: echo "short=${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ steps.version.outputs.short }}
          # The commit the image was built from, for a host's updater to name it by.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/tonimelisma/latchkey-relay:${{ github.sha }}
            ghcr.io/tonimelisma/latchkey-relay:latest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3 # the version a host that verifies the signature checks with
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case $DIGEST in sha256:*) ;; *) echo "no digest from the build" >&2; exit 1 ;; esac
          cosign sign --yes "ghcr.io/tonimelisma/latchkey-relay@$DIGEST"
      - name: Check the signature as a host that verifies it will
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/relay-image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/tonimelisma/latchkey-relay@$DIGEST" >/dev/null
          echo "Published and signed ghcr.io/tonimelisma/latchkey-relay@$DIGEST (${GITHUB_SHA::12}); hosts that verify the signature switch to it." >>"$GITHUB_STEP_SUMMARY"
