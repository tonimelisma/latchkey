# Publishes the relay image to ghcr.io/tonimelisma/latchkey-relay when a tag like relay-v0.1.0 is
# pushed (plan D10). Multi-arch, so it runs on x86 and ARM servers.
name: relay image
on:
  push:
    tags: ["relay-v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
      - name: Test
        working-directory: relay
        run: go test -short ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/tonimelisma/latchkey-relay:${{ github.ref_name }}
            ghcr.io/tonimelisma/latchkey-relay:latest
