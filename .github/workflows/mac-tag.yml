# After CI passes on main for a commit that changed macos/ since the last mac-<x.y.z> tag, gives
# it its release number, the tag mac-<x.y.z> (scripts/release-tag.sh; CI already built and tested
# the app on that commit), pushed with the workflow's own token (a cloud session's proxy refuses
# tag pushes); then builds that release on macOS, signs it, and publishes it with Sparkle's update
# feed (spec 001 FR-072 to FR-072d), so every installed copy updates itself. Both jobs run in the
# environment "release", where the maintainer can require an approval. Also on repository_dispatch
# "mac-tag", and by hand with a version to build an existing tag again (workflow_dispatch).
#
# The release job's secrets live in the release Azure Key Vault; its first step fetches them with the job's GitHub identity token
# (no stored credential: the environment "release" holds only the variables AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_KEY_VAULT, and the Entra app it signs in as trusts only this
# repository's environment "release"). A secret missing from the vault fails that step; one that
# comes back empty makes the job say what is missing and build nothing:
#   MAC_CERTIFICATE_P12        the "Apple Development" certificate and its key, exported from
#                              Keychain Access as .p12, base64 (vault: apple-development-p12-base64)
#   MAC_CERTIFICATE_PASSWORD   that export's password (apple-development-p12-password)
#   MAC_DEVELOPMENT_TEAM       the team ID, kept out of the repository (apple-development-team)
#   SPARKLE_PRIVATE_KEY        Sparkle's EdDSA private key (generate_keys -x; latchkey-sparkle-private-key);
#                              its public key is SPARKLE_PUBLIC_ED_KEY in macos/Config/Base.xcconfig
# The same certificate the Mac signs with keeps the installed app's permissions and pairing.
name: mac tag
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  repository_dispatch:
    types: [mac-tag]
  workflow_dispatch:
    inputs:
      version:
        description: "Build and publish this existing release again (x.y.z); empty: tag the newest commit"
        required: false
permissions:
  contents: read
concurrency:
  group: release-mac
  cancel-in-progress: false
jobs:
  # Which commit, and whether macos/ changed since the last mac-<x.y.z> tag on its history.
  changes:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }} # the commit CI tested
          fetch-depth: 0 # the tags and the diff since the last one
          persist-credentials: false
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(git rev-parse HEAD)
          release=true
          last=$(git tag --merged HEAD --list 'mac-[0-9]*' --sort=-v:refname | head -1)
          if [ "$EVENT" = workflow_run ] && [ -n "$last" ] && git diff --quiet "$last" HEAD -- macos/; then
            release=false
            echo "macos/ unchanged since $last; nothing to release" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          printf 'sha=%s\nrelease=%s\n' "$sha" "$release" | tee -a "$GITHUB_OUTPUT"
  tag:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # the tag
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 0 # release-tag.sh reads the tags and main's history
      - name: Tag this commit mac-<next number>
        id: tag
        env:
          RELEASE_TAG_ON_MAIN: "1"
          AGAIN: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$AGAIN" ]; then
            case $AGAIN in *[!0-9.]* | '') echo "not a version: $AGAIN" >&2; exit 1 ;; esac
            git rev-parse -q --verify "refs/tags/mac-$AGAIN" >/dev/null || { echo "no tag mac-$AGAIN" >&2; exit 1; }
            # Only a release made on main is built and signed again.
            git merge-base --is-ancestor "refs/tags/mac-$AGAIN" origin/main || { echo "mac-$AGAIN isn't on main" >&2; exit 1; }
            echo "version=$AGAIN" >>"$GITHUB_OUTPUT"
            echo "Building mac-$AGAIN again" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rc=0
          version=$(scripts/release-tag.sh mac-) || rc=$?
          case $rc in
            0)
              echo "Tagged mac-$version" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "version=$version" >>"$GITHUB_OUTPUT"
              ;;
            3) echo "A newer commit already has a Mac release number; nothing to tag" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *) exit "$rc" ;;
          esac
  release:
    needs: tag
    if: needs.tag.outputs.version != ''
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # the release and its assets
      id-token: write # the identity token Azure trusts, to read the secrets from Key Vault
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Fetch release secrets from Azure Key Vault
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
          # ENV_NAME=vault-secret-name, one per line
          SECRET_MAP: |
            MAC_CERTIFICATE_P12=apple-development-p12-base64
            MAC_CERTIFICATE_PASSWORD=apple-development-p12-password
            MAC_DEVELOPMENT_TEAM=apple-development-team
            SPARKLE_PRIVATE_KEY=latchkey-sparkle-private-key
        run: |
          set -euo pipefail
          j() { python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$1"; }
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | j value)
          echo "::add-mask::$oidc"
          tok=$(curl -sSf "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" \
            -d client_id="$AZURE_CLIENT_ID" -d grant_type=client_credentials \
            --data-urlencode scope=https://vault.azure.net/.default \
            --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
            --data-urlencode client_assertion="$oidc" | j access_token)
          echo "::add-mask::$tok"
          while IFS='=' read -r name secret; do
            [ -n "$name" ] || continue
            v=$(curl -sSf -H "Authorization: Bearer $tok" \
              "https://$AZURE_KEY_VAULT.vault.azure.net/secrets/$secret?api-version=7.4" | j value)
            echo "::add-mask::$v"
            d="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$d" "$v" "$d" >> "$GITHUB_ENV"
          done <<< "$SECRET_MAP"
      - name: Is the release build set up?
        id: ready
        env:
          P12: ${{ env.MAC_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ env.MAC_CERTIFICATE_PASSWORD }}
          TEAM: ${{ env.MAC_DEVELOPMENT_TEAM }}
          SPARKLE_KEY: ${{ env.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing MAC_CERTIFICATE_P12"
          [ -n "$P12_PASSWORD" ] || missing="$missing MAC_CERTIFICATE_PASSWORD"
          [ -n "$TEAM" ] || missing="$missing MAC_DEVELOPMENT_TEAM"
          [ -n "$SPARKLE_KEY" ] || missing="$missing SPARKLE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::The Mac release build isn't set up yet; missing secrets:$missing (the release Key Vault, AZURE_KEY_VAULT). Nothing was built."
            echo "Mac release build not set up; missing:$missing" >>"$GITHUB_STEP_SUMMARY"
            echo "ready=false" >>"$GITHUB_OUTPUT"
          else
            echo "ready=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ready == 'true'
        with:
          ref: refs/tags/mac-${{ needs.tag.outputs.version }}
          fetch-depth: 0 # package.sh reads the commit's release tag
          persist-credentials: false
      - name: The build carries the update key
        if: steps.ready.outputs.ready == 'true'
        run: |
          grep -q '^SPARKLE_PUBLIC_ED_KEY = [A-Za-z0-9+/=]\{40,\}' macos/Config/Base.xcconfig || {
            echo "::error::SPARKLE_PUBLIC_ED_KEY is empty in macos/Config/Base.xcconfig: installed copies couldn't check this release's signature"
            exit 1
          }
      - name: XcodeGen, pinned by checksum
        if: steps.ready.outputs.ready == 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.45.0/xcodegen.zip
          echo "fb55d430229e0c00c4c354e682f2ac86f413f28468fbf83cd8b85d0a703a0fdb  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >>"$GITHUB_PATH"
      - name: The signing certificate, in a keychain of this run's own
        id: keychain
        if: steps.ready.outputs.ready == 'true'
        env:
          P12: ${{ env.MAC_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ env.MAC_CERTIFICATE_PASSWORD }}
          TEAM: ${{ env.MAC_DEVELOPMENT_TEAM }}
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          pw=$(uuidgen)
          echo "::add-mask::$pw"
          printf '%s' "$P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -v -p codesigning "$kc" | awk '/Apple Development/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::no Apple Development identity in MAC_CERTIFICATE_P12"; exit 1; }
          echo "identity=$identity" >>"$GITHUB_OUTPUT"
          echo "keychain=$kc" >>"$GITHUB_OUTPUT"
          printf 'DEVELOPMENT_TEAM = %s\n' "$TEAM" >macos/Config/Local.xcconfig
      - name: Build the disk image (package.sh)
        if: steps.ready.outputs.ready == 'true'
        working-directory: macos
        env:
          XCODEBUILD_SIGNING: CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=${{ steps.keychain.outputs.identity }} PROVISIONING_PROFILE_SPECIFIER= OTHER_CODE_SIGN_FLAGS=--keychain=${{ steps.keychain.outputs.keychain }}
        run: ./scripts/package.sh
      - name: Sparkle's update archive, signed, and its feed
        if: steps.ready.outputs.ready == 'true'
        working-directory: macos
        env:
          SPARKLE_KEY: ${{ env.SPARKLE_PRIVATE_KEY }}
        run: |
          zip="$RUNNER_TEMP/Latchkey-$VERSION.zip"
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release/Latchkey.app "$zip"
          # The private key goes in on standard input, never to a file.
          out=$(printf '%s' "$SPARKLE_KEY" | build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "$zip")
          signature=$(printf '%s' "$out" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          [ -n "$signature" ] || { echo "::error::sign_update gave no signature"; exit 1; }
          length=$(stat -f %z "$zip")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/mac-$VERSION/Latchkey-$VERSION.zip"
          ./scripts/appcast.sh "$VERSION" "$url" "$length" "$signature" >"$RUNNER_TEMP/appcast.xml"
          cat "$RUNNER_TEMP/appcast.xml"
      - name: Publish the release (publish.sh)
        if: steps.ready.outputs.ready == 'true'
        working-directory: macos
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish.sh "$VERSION" "$RUNNER_TEMP/Latchkey-$VERSION.zip" "$RUNNER_TEMP/appcast.xml"
      - name: Remove the keychain and key
        if: always()
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          [ -z "$KEYCHAIN" ] || security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/cert.p12" macos/Config/Local.xcconfig
