# The one CI workflow: every pull request, every push to main, daily (so a newly published
# vulnerability fails CI without a push) and by hand. The relay's tests, lint and security checks
# (known vulnerabilities, committed secrets, untidy modules); the Linux program's tests and lint;
# the repository scripts' tests and the workflows themselves (actionlint); the process checks
# (requirements, tests and doc links agree; the pull request's description); and the Mac app,
# built, linted and tested on GitHub's macOS runner whenever macos/ changed (passing at once when
# it didn't; skipped by the daily run). `CI gate` needs every job and is the one required check.
# The release workflows run after this one succeeds on main. Actions are pinned to commit SHAs;
# Dependabot updates them. The Mac jobs are signed ad hoc, with no secrets and a read-only token.
name: CI
on:
  pull_request:
    # `edited`: a description fixed after the push re-runs the checks that read it. Every job runs
    # on it (the Mac jobs pass at once for a tree this pull request already tested), so the newest
    # `CI gate` on a commit always reflects all the checks.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # daily (latchkey keeps a daily run rather than the weekly one)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a pull request's run; every run on main finishes, since each one's
  # success starts the release workflows.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      # `make semgrep` runs the pinned Semgrep through uvx, which ubuntu-latest doesn't ship.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Security checks
        run: make security
      - name: Build
        run: make build
      - name: Lint
        run: make lint
      - name: Test (race detector, headless Chrome)
        run: make test
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.sum
      - name: Lint (also the Linux-only files)
        run: make lint
      - name: Test (race detector)
        run: make test
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Deploy and repository script tests
        run: make -C relay script-tests
      - name: Workflows (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # pr-check diffs the pull request's base and head
          persist-credentials: false
      - name: process-check
        run: script/process-check
      - name: pr-check
        if: github.event_name == 'pull_request'
        run: script/pr-check

  mac-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # on main: did this exact code pass its pull request's Mac tests?
    outputs:
      mac: ${{ steps.diff.outputs.mac }}
      test: ${{ steps.diff.outputs.test }}
      shards: ${{ steps.diff.outputs.shards }}
      tree: ${{ steps.diff.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff against the pull request's base, or the pushed range
          persist-credentials: false
      # mac: macos/ (or this file) changed. test: run the tests (not when main's code is the
      # very tree its pull request passed; that pull request's "mac" job left an artifact named
      # after the tree). tree: the tested tree (a pull request's merge commit).
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mac=true
          # The daily run checks the relay, Linux and the process; the Mac app is built and tested
          # when it changes (GitHub runs five macOS jobs at once on this plan).
          if [ "$EVENT" = schedule ]; then
            mac=false
          elif [ "$EVENT" != workflow_dispatch ] && git cat-file -e "$BASE^{commit}" 2>/dev/null &&
            ! git diff --name-only "$BASE...HEAD" | grep -qE '^(macos/|docs/design/contracts/fixtures/|\.github/workflows/ci\.yml$)'; then
            mac=false
          fi
          test=$mac
          if [ "$mac" = true ] && { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; }; then
            n=$(gh api "repos/$REPO/actions/artifacts?name=mac-tested-$tree&per_page=5" \
              --jq '[.artifacts[] | select(.expired | not)] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ] && [ "$EVENT" = push ]; then
              test=false
              echo "This exact code (tree $tree) passed its pull request's Mac tests: build only, for the cache."
            elif [ "${n:-0}" -gt 0 ]; then
              # A description edit or a re-run of a tree this pull request already passed.
              mac=false
              test=false
              echo "This exact code (tree $tree) already passed the Mac tests on this pull request."
            fi
          fi
          shards='[0,1,2,3]'
          [ "$test" = true ] || shards='[0]'
          printf 'mac=%s\ntest=%s\nshards=%s\ntree=%s\n' "$mac" "$test" "$shards" "$tree" | tee -a "$GITHUB_OUTPUT"
  # The Mac app: four jobs side by side (decided 2026-11-26: "split the slow step into parallel jobs, get it
  # to 5 minutes"; GitHub runs at most 5 macOS jobs at once on this plan, so a fifth stays free for
  # the next push). Each builds (with Xcode's compilation cache and the Swift packages kept between
  # runs), then runs its part: job 0 lints and runs the update and unit tests; all four share
  # the tests with web pages or time limits, in two test programs per job, each running its
  # tests one at a time, split by measured time (macos/scripts/shard-suites.py,
  # macos/scripts/suite-seconds.txt).
  build:
    name: build and test (${{ matrix.shard }})
    needs: mac-changes
    if: needs.mac-changes.outputs.mac == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TEST: ${{ needs.mac-changes.outputs.test }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mac-changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.shard == 3 && '0' || '1' }} # job 3: the diff that picks the end-to-end checks
          persist-credentials: false
      - name: XcodeGen, pinned by checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.45.0/xcodegen.zip
          echo "fb55d430229e0c00c4c354e682f2ac86f413f28468fbf83cd8b85d0a703a0fdb  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >>"$GITHUB_PATH"
      - name: Lint (swift format, as make lint)
        if: matrix.shard == 0 && env.TEST == 'true'
        working-directory: macos
        run: swift format lint --strict -r App Shared Helper Tests
      # Xcode's compilation cache (Xcode 26), kept between runs: runs on main save it, pull
      # requests start from main's (and their own last run's), so a build compiles only what
      # changed instead of everything (decided 2026-11-25: "cut the 40 minutes").
      # Job 0 saves the caches; the others only take them (saving the same key five times
      # costs each job ~10 s at its end and only one save can win).
      - name: Compilation cache
        if: matrix.shard == 0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xcache
          key: mac-xcache-${{ hashFiles('macos/project.yml') }}-${{ github.sha }}
          restore-keys: |
            mac-xcache-${{ hashFiles('macos/project.yml') }}-
            mac-xcache-
      - name: Compilation cache (taken only)
        if: matrix.shard != 0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xcache
          key: mac-xcache-${{ hashFiles('macos/project.yml') }}-${{ github.sha }}
          restore-keys: |
            mac-xcache-${{ hashFiles('macos/project.yml') }}-
            mac-xcache-
      # The Swift packages (Sparkle and the rest), pinned in project.yml: fetched once, not
      # every run (about 90 s of each build before, 2026-11-26).
      - name: Swift packages cache
        if: matrix.shard == 0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/spm
          key: mac-spm-${{ hashFiles('macos/project.yml') }}
      - name: Swift packages cache (taken only)
        if: matrix.shard != 0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/spm
          key: mac-spm-${{ hashFiles('macos/project.yml') }}
      - name: Build for testing (signed ad hoc)
        working-directory: macos
        run: |
          set -o pipefail
          xcodebuild -version
          xcodegen generate --quiet
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/xcache" \
            build-for-testing -quiet
          du -sh "$RUNNER_TEMP/xcache" 2>/dev/null || true
      - name: Update tests
        if: matrix.shard == 0 && env.TEST == 'true'
        working-directory: macos
        run: |
          set -o pipefail
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -only-testing:LatchkeyTests/UpdateGateTests -only-testing:LatchkeyTests/ReleaseCheckTests \
            test-without-building -quiet
      # The whole unit test suite. Each failure is printed with why, and the test host's crash
      # reports with their stacks. Without the tests that open web pages or measure time limits:
      # they run one at a time in the next step.
      - name: Unit tests
        if: matrix.shard == 0 && env.TEST == 'true'
        working-directory: macos
        run: |
          rc=0
          skip=$(cat scripts/page-suites.txt scripts/timing-suites.txt | sed 's/^/-skip-testing:LatchkeyTests\//' | tr '\n' ' ')
          # shellcheck disable=SC2086
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" $skip test-without-building > "$RUNNER_TEMP/test.log" 2>&1 || rc=$?
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/tests.xcresult" \
            | jq -r '"UNIT passed \(.passedTests) failed \(.failedTests)", (.testFailures[]? | "FAILURE \(.testIdentifierString): \(.failureText)")' | head -300 || true
          find ~/Library/Logs/DiagnosticReports -name '*.ips' -mmin -60 2>/dev/null | head -3 | while read -r f; do
            echo "== $f"
            tail -n +2 "$f" | jq -r '.threads[]? | select(.triggered == true) | .frames[:25][] | "\(.imageIndex) \(.symbol // "?") \(.sourceFile // "")"' || head -80 "$f"
          done
          tail -40 "$RUNNER_TEMP/test.log"
          exit "$rc"
      # Tests of short time limits, alone on the runner (job 0, after the unit tests): beside
      # another test program a 0.5 s limit measured 0.514 s (2026-11-26).
      - name: Tests of short time limits, alone
        if: always() && matrix.shard == 0 && env.TEST == 'true'
        working-directory: macos
        run: |
          rc=0
          only=$(python3 scripts/shard-suites.py quiet | sed 's/^/-only-testing:LatchkeyTests\//' | tr '\n' ' ')
          # shellcheck disable=SC2086
          xcodebuild test-without-building -xctestrun "$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 1 -name '*.xctestrun' | head -1)" \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd-quiet" \
            -resultBundlePath "$RUNNER_TEMP/quiet.xcresult" -parallel-testing-enabled NO $only \
            > "$RUNNER_TEMP/quiet.log" 2>&1 || rc=$?
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/quiet.xcresult" \
            | jq -r '"QUIET passed \(.passedTests) failed \(.failedTests)", (.testFailures[]? | "QUIET FAILURE \(.testIdentifierString): \(.failureText)")' | head -50 | cut -c1-3000 || true
          tail -3 "$RUNNER_TEMP/quiet.log"
          exit "$rc"
      # The tests that open web pages, one at a time within a test program (decided 2026-11-25):
      # run side by side in one program, dozens of pages share its one main thread, so a page's
      # events come late and steps pass their limits (measured 2026-11-25: a click 2 s alone,
      # 18 s among 70 pages). With them, the tests of time limits: side by side with the rest,
      # a 2.8 s limit measured 13.6 s (2026-11-25). Two programs per job, each with its own main
      # thread (the runner has three cores); job 0's are shorter by its unit tests.
      - name: Tests with web pages or time limits, one at a time per program
        if: always() && env.TEST == 'true'
        working-directory: macos
        run: |
          run=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 1 -name '*.xctestrun' | head -1)
          for lane in 0 1; do
            group=$(( ${{ matrix.shard }} * 2 + lane ))
            # Job 0's programs start later by its update, unit and short-limit tests (~140 s,
            # measured 2026-11-26), job 3's by the end-to-end check (~105 s with Go and the pick).
            only=$(python3 scripts/shard-suites.py 8 "$group" 140 2 105 2 | sed 's/^/-only-testing:LatchkeyTests\//' | tr '\n' ' ')
            echo "program $lane: $only"
            # shellcheck disable=SC2086
            ( rc=0; xcodebuild test-without-building -xctestrun "$run" -destination 'platform=macOS' \
                -derivedDataPath "$RUNNER_TEMP/dd-$lane" -resultBundlePath "$RUNNER_TEMP/pages-$lane.xcresult" \
                -parallel-testing-enabled NO $only > "$RUNNER_TEMP/pages-$lane.log" 2>&1 || rc=$?
              echo "$rc" > "$RUNNER_TEMP/rc-$lane" ) &
          done
          wait
          rc=0
          for lane in 0 1; do
            [ "$(cat "$RUNNER_TEMP/rc-$lane")" = 0 ] || rc=1
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/pages-$lane.xcresult" \
              | jq -r '"PAGES passed \(.passedTests) failed \(.failedTests)", (.testFailures[]? | "PAGES FAILURE \(.testIdentifierString): \(.failureText)")' | head -150 | cut -c1-3000 || true
            # Where the time goes (instrumentation): each suite's seconds, for suite-seconds.txt,
            # and the slowest 10 tests.
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/pages-$lane.xcresult" > "$RUNNER_TEMP/pages-tests.json" || true
            jq -r '.. | objects | select(.nodeType? == "Test Suite") | "SUITE \([.. | objects | select(.nodeType? == "Test Case") | .durationInSeconds // 0] | add // 0 | ceil) \(.name)"' "$RUNNER_TEMP/pages-tests.json" || true
            jq -r '[.. | objects | select(.nodeType? == "Test Case") | {n: .name, d: (.durationInSeconds // 0)}] | sort_by(-.d) | .[:5][] | "SLOW \(.d | floor)s \(.n)"' "$RUNNER_TEMP/pages-tests.json" || true
            tail -3 "$RUNNER_TEMP/pages-$lane.log"
          done
          exit "$rc"

      # The end-to-end check of the Mac app's real tools (spec 015): a real MCP client through a
      # private relay, the app's tools served by the Swift host test E2EHostTests from this
      # job's build. Its checks are reported, not required (decided 2026-11-25).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: always() && matrix.shard == 3 && env.TEST == 'true'
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      # Which end-to-end checks the change selects (spec 015 FR-1500, relay/e2e/capabilities.json).
      - id: pick
        if: always() && matrix.shard == 3 && env.TEST == 'true'
        working-directory: relay
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: go run ./cmd/e2e pick -base "$BASE"
      - name: End to end, the Mac app's real tools through a private relay (reported)
        if: always() && matrix.shard == 3 && steps.pick.outputs.mac == 'true'
        continue-on-error: true
        working-directory: relay
        env:
          CHECKS: ${{ steps.pick.outputs.mac_checks }}
        run: |
          set -o pipefail
          go run ./cmd/e2e mac -checks "$CHECKS" -derived-data "$RUNNER_TEMP/dd"

  # The Mac app's result: passes when macos/ didn't change, or when every build-and-test job
  # passed; fails on any failed, cancelled or missing job. It also records a pull request's
  # tested tree, so main and later runs of the same tree skip the tests.
  mac:
    needs: [mac-changes, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.mac-changes.result }}
          MAC: ${{ needs.mac-changes.outputs.mac }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES, macos/ changed: $MAC, build and test: $BUILD"
          [ "$CHANGES" = success ] || exit 1
          [ "$MAC" = true ] || exit 0
          [ "$BUILD" = success ]
      # A pull request's tested tree, so main skips the tests when it merges exactly this code.
      - name: Mark this code as tested
        if: github.event_name == 'pull_request' && needs.mac-changes.outputs.mac == 'true' && needs.mac-changes.outputs.test == 'true'
        env:
          TREE: ${{ needs.mac-changes.outputs.tree }}
        run: echo "$TREE" >"$RUNNER_TEMP/tested"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request' && needs.mac-changes.outputs.mac == 'true' && needs.mac-changes.outputs.test == 'true'
        with:
          name: mac-tested-${{ needs.mac-changes.outputs.tree }}
          path: ${{ runner.temp }}/tested
          retention-days: 7

  # The one required status check. It needs every other job and passes only when each of them
  # succeeded or was skipped, so a cancelled or failed job can never be merged around.
  gate:
    name: CI gate
    if: always()
    needs: [relay, linux, scripts, process, mac-changes, build, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
