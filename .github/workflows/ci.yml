# Every push and pull request: the relay's tests, lint, and security checks (known vulnerabilities,
# committed secrets, untidy modules). Actions are pinned to commit SHAs; Dependabot updates them.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily, so a newly published vulnerability fails CI without a push
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      # `make semgrep` runs the pinned Semgrep through uvx, which ubuntu-latest doesn't ship.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Security checks
        run: make security
      - name: Build
        run: make build
      - name: Lint
        run: make lint
      - name: Test (race detector, headless Chrome)
        run: make test
