# Every push and pull request: the relay's tests, lint, and security checks (known vulnerabilities,
# committed secrets, untidy modules); the Linux program's tests and lint; the deploy and repository
# scripts' tests; and the workflows themselves (actionlint). Actions are pinned to commit SHAs;
# Dependabot updates them.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily, so a newly published vulnerability fails CI without a push
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      # `make semgrep` runs the pinned Semgrep through uvx, which ubuntu-latest doesn't ship.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Security checks
        run: make security
      - name: Build
        run: make build
      - name: Lint
        run: make lint
      - name: Test (race detector, headless Chrome)
        run: make test
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.sum
      - name: Lint (also the Linux-only files)
        run: make lint
      - name: Test (race detector)
        run: make test
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Deploy and repository script tests
        run: make -C relay script-tests
      - name: Workflows (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
  # The Mac app's build, unit tests and lint, on GitHub's Mac runner, so a cloud session can test
  # Mac changes without the owner's Mac (2026-11-23). Signed ad hoc: no team, no Local.xcconfig.
  mac:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
          sw_vers
      - name: Lint
        run: swift format lint --strict -r App Shared Helper Tests
      - name: Test
        run: |
          set -o pipefail
          xcodegen generate --quiet
          rc=0
          xcodebuild -project Latchkey.xcodeproj -scheme Latchkey -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" test > "$RUNNER_TEMP/test.log" 2>&1 || rc=$?
          grep -E "error:|Expectation failed|Fatal error|crashed|' failed |✘" "$RUNNER_TEMP/test.log" | head -300 || true
          tail -40 "$RUNNER_TEMP/test.log"
          exit "$rc"
