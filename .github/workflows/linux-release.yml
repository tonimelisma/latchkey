# Publishes the Linux program (spec 010 plan D12) after CI passes on main for a commit that changed
# linux/ since the last linux-<x.y.z> tag, or when a session asks with repository_dispatch
# "linux-release" (a cloud session's proxy refuses tag pushes and release writes, so they happen
# here). CI on main already ran the program's lint and tests on that commit. The release job tags the commit
# linux-<x.y.z> (scripts/release-tag.sh), builds both architectures, signs them with
# SERVER_SIGNING_KEY, and publishes them with SHA256SUMS and install.sh. The key lives in the release Azure
# Key Vault (secret latchkey-server-signing-key); the release job's first step fetches it with the
# job's GitHub identity token (no stored credential; the Entra app it signs in as trusts only this
# repository's environment "release").
# Installed servers find it themselves within a day and check each download's
# signature against the key built into the program; no workflow ever reaches a server.
# The release job runs in the environment "release", where the maintainer can require an approval.
name: linux release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  repository_dispatch:
    types: [linux-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-linux
  cancel-in-progress: false
jobs:
  # Which commit, and whether linux/ changed since the last linux-<x.y.z> tag on its history.
  changes:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }} # the commit CI tested
          fetch-depth: 0 # the tags and the diff since the last one
          persist-credentials: false
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(git rev-parse HEAD)
          release=true
          last=$(git tag --merged HEAD --list 'linux-[0-9]*' --sort=-v:refname | head -1)
          if [ "$EVENT" = workflow_run ] && [ -n "$last" ] && git diff --quiet "$last" HEAD -- linux/; then
            release=false
            echo "linux/ unchanged since $last; nothing to release" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          printf 'sha=%s\nrelease=%s\n' "$sha" "$release" | tee -a "$GITHUB_OUTPUT"
  release:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # the tag and the release
      id-token: write # the identity token Azure trusts, to read the signing key from Key Vault
    steps:
      - name: Fetch release secrets from Azure Key Vault
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
          # ENV_NAME=vault-secret-name, one per line
          SECRET_MAP: |
            SERVER_SIGNING_KEY=latchkey-server-signing-key
        run: |
          set -euo pipefail
          j() { python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$1"; }
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | j value)
          echo "::add-mask::$oidc"
          tok=$(curl -sSf "https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token" \
            -d client_id="$AZURE_CLIENT_ID" -d grant_type=client_credentials \
            --data-urlencode scope=https://vault.azure.net/.default \
            --data-urlencode client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
            --data-urlencode client_assertion="$oidc" | j access_token)
          echo "::add-mask::$tok"
          while IFS='=' read -r name secret; do
            [ -n "$name" ] || continue
            v=$(curl -sSf -H "Authorization: Bearer $tok" \
              "https://$AZURE_KEY_VAULT.vault.azure.net/secrets/$secret?api-version=7.4" | j value)
            echo "::add-mask::$v"
            d="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$d" "$v" "$d" >> "$GITHUB_ENV"
          done <<< "$SECRET_MAP"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 0 # release-tag.sh reads the tags and main's history
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.sum
      - name: Tag, build, sign, publish
        env:
          SERVER_SIGNING_KEY: ${{ env.SERVER_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_ON_MAIN: "1"
        run: sh linux/scripts/release.sh
