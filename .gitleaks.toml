# gitleaks: the default rules, plus the relay's OAuth test fixtures, whose tokens are made under
# a test key published next to them (not secrets).
[extend]
useDefault = true

[[allowlists]]
description = "OAuth test fixture: a grant written by the fosite-era relay under a test key"
paths = ['''^relay/internal/oauth/testdata/fosite-0\.49-grant\.json$''']

[[allowlists]]
description = "OAuth token-format test: a token under a test key with key bytes 0 to 31"
regexes = ['''^ory_rt_AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8\.3RoVBAJ3lVhnYh077jrkVPJQjp987MkRaieXBMg9npQ$''']

[[allowlists]]
description = "Spec 013 tests: RFC 6238's published test secret (\"12345678901234567890\" in base32)"
regexes = ['''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''']

[[allowlists]]
description = "A repository name (owner/name), not a key, in a deleted setup script's history"
regexes = ['''^tonimelisma/latchkey$''']

[[allowlists]]
description = "Sparkle's public update key (EdDSA public half; public by design, spec 001 FR-072)"
regexes = ['''taGyPBum8bkweq78chQL0mQhqfMc9jrnXd564\+e\+adE=''']

[[allowlists]]
description = "Spec 014: Latchkey's developer's PUBLIC key for problem reports (public by design; its private half is never in the repository)"
paths = ['''^relay/reports/developer\.pub$''']

[[allowlists]]
description = "Spec 014 tests: a made-up cloud secret in a report's answer, to check it is blanked"
regexes = ['''wJalrXUtnFEMIK7MDENGbPxRfiCY''']

[[allowlists]]
description = "Cloud secrets test: a made-up key (base64 of \"secret-key\") in that test's first commit, made at run time since"
regexes = ['''c2VjcmV0LWtleQ==''']
