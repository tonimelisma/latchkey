// Latchkey: automatic updates on the relay's server (deploy/harden.sh installs this as
// /etc/apt/apt.conf.d/52latchkey-unattended). Ubuntu's security updates (the default) plus
// Docker's own packages; a reboot when an update needs one, at 12:00 UTC (04:00 in California
// in winter, 05:00 in summer). Docker keeps the containers running while it restarts itself
// (live-restore), and the Macs reconnect after a reboot by themselves.
Unattended-Upgrade::Origins-Pattern {
	"origin=Docker,label=Docker CE,codename=${distro_codename}";
};
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "12:00";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "false";
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";
