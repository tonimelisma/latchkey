{{template "head" .}}
<h1>Recover your account</h1>
<p>If you lost your passkeys, we'll email you a link to create a new one. Your old passkeys will stop working.</p>
<form method="post" action="/recover">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required autofocus value="{{.Email}}">
  {{template "error" .}}
  <button class="primary" type="submit">Send recovery link</button>
</form>
{{template "foot" .}}
