{{template "head" .}}
<h1>Create your account</h1>
<p>Enter your email. We'll send you a link to confirm it, then you'll create a passkey. There's no password.</p>
<form method="post" action="/signup">
  <input type="hidden" name="next" value="{{.Next}}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required autofocus value="{{.Email}}">
  {{template "error" .}}
  <button class="primary" type="submit">Continue</button>
</form>
<p class="small">Already have an account? <a href="/signin?next={{.Next}}">Sign in</a></p>
{{template "foot" .}}
