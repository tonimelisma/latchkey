{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}}</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
{{if not .Plain}}<script src="/static/passkey.js" defer></script>
{{end}}</head>
<body>
<main class="card{{if .Wide}} wide{{end}}">
<div class="mark" aria-hidden="true"><img src="/static/icon.svg" alt="" width="44" height="44"></div>
{{end}}

{{define "foot"}}
</main>
{{if .SignedIn}}<p class="footer"><a href="/account">Your account</a></p>{{end}}
{{if .Legal}}<p class="footer"><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></p>{{end}}
</body>
</html>
{{end}}

{{define "error"}}<p class="error" role="alert" id="error"{{if not .Error}} hidden{{end}}>{{.Error}}</p>{{end}}
